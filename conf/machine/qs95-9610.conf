#@TYPE: Machine
#@NAME: Ka-Ro QS95-9610 module
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for Ka-Ro QS95-9610 module
##@MAINTAINER: Robin Lintermann <rl@karo-electronics.de>

MACHINEOVERRIDES =. "qs95:"

require include/imx95-base.inc

IMXBOOT_TARGETS_BASENAME = "flash"

UBOOT_CONFIG[default] = "qs95-9610_defconfig"
UBOOT_CONFIG[mfg] = "qs95-9610_mfg_defconfig"
UBOOT_CONFIG[noenv] = "qs95-9610_noenv_defconfig"

OEI_BOARD  = "qs95-9610"
DDR_TYPE   = "lpddr4x"
DDR_FIRMWARE_NAME = " \
    lpddr4x_dmem_v202409.bin \
    lpddr4x_dmem_qb_v202409.bin \
    lpddr4x_imem_v202409.bin \
    lpddr4x_imem_qb_v202409.bin \
"
OEI_DDR_CONFIG     = "QS95_9610_3733MTS_FW2024.09_timing"
OEI_DDR_CONFIG_ECC = "QS95_9610_3733MTS_FW2024.09_timing"

NETWORK_INTERFACES ?= "eth0 eth1"
