#@TYPE: Machine
#@NAME: Ka-Ro electronics NXP i.MX93 QS91-3110 Computer-On-Module
#@SOC: i.MX91
#@DESCRIPTION: Machine configuration for Ka-Ro electronics QS91-3110 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>
#@VERSION: 1
#@DATE: 2023-01-27

MACHINEOVERRIDES =. "qs91:"

require include/imx91-base.inc

KARO_BOARD_PMIC = "pca9450"

IMX_BOOT_UART_BASE ??= "0x42580000"

# u-boot configs
UBOOT_CONFIG[default] = "qs91-3110_config"
UBOOT_CONFIG[mfg] = "qs91-3110_mfg_config"
UBOOT_CONFIG[noenv] = "qs91-3110_noenv_config"
UBOOT_CONFIG[ecc] = "qs91-3110_ecc_config"
