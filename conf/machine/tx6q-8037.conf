#@TYPE: Machine
#@NAME: Ka-Ro electronics TX6Q-8037
#@SOC: i.MX6QP
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TX6Q-8037 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "tx6q:tx6-emmc:"

require include/imx6q-base.inc

# Shared imx6q fragments; DTS name uses the SoC.
DTB_BASENAME = "imx6qp-${MACHINE}"

UBOOT_ENV_FILE = "tx6q-8037-${KARO_BASEBOARD}"

# u-boot configs
UBOOT_CONFIG[default] = "tx6q-8037-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6q-8037_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6q-8037_noenv_defconfig"
