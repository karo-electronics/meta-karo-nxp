#@TYPE: Machine
#@NAME: Ka-Ro electronics TXUL-5010
#@SOC: i.MX6UL
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TXUL-5010 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "txul:tx6-nand:"

require include/imx6ul-base.inc

# NAND only: karo-base.inc adds "emmc" unconditionally.
MACHINE_FEATURES:remove = "emmc"
MACHINE_FEATURES += "nand"

# Must match the 40 MiB rootfs partition in CONFIG_MTDPARTS_DEFAULT.
ROOTFS_PARTITION_SIZE = "40960"

# The tree names its environment tx6ul-, not txul-.
UBOOT_ENV_FILE = "tx6ul-5010-${KARO_BASEBOARD}"

# u-boot configs
UBOOT_CONFIG[default] = "tx6ul-5010-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6ul-5010_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6ul-5010_noenv_defconfig"
