#@TYPE: Machine
#@NAME: Ka-Ro electronics TX6S-8135
#@SOC: i.MX6S
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TX6S-8135 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "tx6s:"

require include/imx6dl-base.inc

# 4MiB erase group rejects a GPT at 1MiB.
UUU_GPT_START = "4MiB"
# ROM reads the IVT at sector 2; write raw.
UUU_BOOTLOADER_METHOD = "raw"
UUU_BOOTLOADER_BLK = "0x2"
UUU_FASTBOOT_BUF_ADDR = "0x12000000"

UBOOT_ENV_FILE = "tx6s-8135-${KARO_BASEBOARD}"

# u-boot configs
UBOOT_CONFIG[default] = "tx6s-8135-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6s-8135_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6s-8135_noenv_defconfig"
