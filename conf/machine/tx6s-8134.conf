#@TYPE: Machine
#@NAME: Ka-Ro electronics TX6S-8134
#@SOC: i.MX6S
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TX6S-8134 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "tx6s:"

require include/imx6dl-base.inc

# NAND only: karo-base.inc adds "emmc" unconditionally.
MACHINE_FEATURES:remove = "emmc"
MACHINE_FEATURES += "nand"
MACHINE_FEATURES += "lvds"

# Must match the 40 MiB rootfs partition in CONFIG_MTDPARTS_DEFAULT.
ROOTFS_PARTITION_SIZE = "40960"

# u-boot configs
UBOOT_CONFIG[default] = "tx6s-8134-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6s-8134-mb7_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6s-8134-mb7_noenv_defconfig"
