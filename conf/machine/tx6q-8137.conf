#@TYPE: Machine
#@NAME: Ka-Ro electronics TX6Q-8137
#@SOC: i.MX6QP
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TX6Q-8137 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "tx6q:"

require include/imx6q-base.inc

# Shared imx6q fragments; DTS name uses the SoC.
DTB_BASENAME = "imx6qp-${MACHINE}"

# 4MiB erase group rejects a GPT at 1MiB.
UUU_GPT_START = "4MiB"
# ROM reads the IVT at sector 2; write raw.
UUU_BOOTLOADER_METHOD = "raw"
UUU_BOOTLOADER_BLK = "0x2"
UUU_FASTBOOT_BUF_ADDR = "0x12000000"

UBOOT_ENV_FILE = "tx6q-8137-${KARO_BASEBOARD}"

# u-boot configs
UBOOT_CONFIG[default] = "tx6q-8137-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6q-8137_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6q-8137_noenv_defconfig"
