#@TYPE: Machine
#@NAME: Ka-Ro electronics TX6Q-1036
#@SOC: i.MX6Q
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TX6Q-1036 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "tx6q:tx6-emmc:"

require include/imx6q-base.inc

UBOOT_ENV_FILE = "tx6q-1036-${KARO_BASEBOARD}"

# u-boot configs
UBOOT_CONFIG[default] = "tx6q-1036-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6q-1036_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6q-1036_noenv_defconfig"
