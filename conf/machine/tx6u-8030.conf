#@TYPE: Machine
#@NAME: Ka-Ro electronics TX6U-8030
#@SOC: i.MX6DL
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TX6U-8030 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "tx6u:tx6-nand:"

require include/imx6dl-base.inc

# NAND only: karo-base.inc adds "emmc" unconditionally.
MACHINE_FEATURES:remove = "emmc"
MACHINE_FEATURES += "nand"

# Buffer address of the mfg U-Boot; nandbcb reads from it.
UUU_FASTBOOT_BUF_ADDR = "0x12000000"

# Must match the 40 MiB rootfs partition in CONFIG_MTDPARTS_DEFAULT.
ROOTFS_PARTITION_SIZE = "40960"

UBOOT_ENV_FILE = "tx6u-8030-${KARO_BASEBOARD}"

# u-boot configs
UBOOT_CONFIG[default] = "tx6u-8030-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6u-8030_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6u-8030_noenv_defconfig"
