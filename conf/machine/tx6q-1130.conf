#@TYPE: Machine
#@NAME: Ka-Ro electronics TX6Q-1130
#@SOC: i.MX6Q
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TX6Q-1130 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "tx6q:"

require include/imx6q-base.inc

# NAND only: karo-base.inc adds "emmc" unconditionally.
MACHINE_FEATURES:remove = "emmc"
MACHINE_FEATURES += "nand"
MACHINE_FEATURES += "lvds"

# Must match the 40 MiB rootfs partition in CONFIG_MTDPARTS_DEFAULT.
ROOTFS_PARTITION_SIZE = "40960"

# u-boot configs
UBOOT_CONFIG[default] = "tx6q-1130-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6q-1130-mb7_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6q-1130-mb7_noenv_defconfig"
