#@TYPE: Machine
#@NAME: Ka-Ro electronics TXUL-5011
#@SOC: i.MX6UL
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TXUL-5011 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "txul:tx6-emmc:"

require include/imx6ul-base.inc

# 4MiB erase group rejects a GPT at 1MiB.
UUU_GPT_START = "4MiB"
# ROM reads the IVT at sector 2; write raw.
UUU_BOOTLOADER_METHOD = "raw"
UUU_BOOTLOADER_BLK = "0x2"
UUU_FASTBOOT_BUF_ADDR = "0x82000000"

# The tree names its environment tx6ul-, not txul-.
UBOOT_ENV_FILE = "tx6ul-5011-${KARO_BASEBOARD}"

# u-boot configs
UBOOT_CONFIG[default] = "tx6ul-5011-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6ul-5011_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6ul-5011_noenv_defconfig"
