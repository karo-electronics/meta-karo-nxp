#@TYPE: Machine
#@NAME: Ka-Ro electronics TX6U-8033
#@SOC: i.MX6DL
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TX6U-8033 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "tx6u:"

require include/imx6dl-base.inc

# 4MiB erase group rejects a GPT at 1MiB.
UUU_GPT_START = "4MiB"
# ROM reads the IVT at sector 2; write raw.
UUU_BOOTLOADER_METHOD = "raw"
UUU_BOOTLOADER_BLK = "0x2"
UUU_FASTBOOT_BUF_ADDR = "0x12000000"

UBOOT_ENV_FILE = "tx6u-8033-${KARO_BASEBOARD}"

# u-boot configs
UBOOT_CONFIG[default] = "tx6u-8033-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6u-8033_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6u-8033_noenv_defconfig"
