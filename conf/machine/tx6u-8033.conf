#@TYPE: Machine
#@NAME: Ka-Ro electronics TX6U-8033
#@SOC: i.MX6DL
#@DESCRIPTION: Machine configuration for Ka-Ro electronics TX6U-8033 Computer-On-Module
#@MAINTAINER: Ka-Ro electronics GmbH <support@karo-electronics.com>

MACHINEOVERRIDES =. "tx6u:tx6-emmc:"

require include/imx6dl-base.inc

UBOOT_ENV_FILE = "tx6u-8033-${KARO_BASEBOARD}"

# u-boot configs
UBOOT_CONFIG[default] = "tx6u-8033-mb7_defconfig"
UBOOT_CONFIG[mfg] = "tx6u-8033-mb7_mfg_defconfig"
UBOOT_CONFIG[noenv] = "tx6u-8033-mb7_noenv_defconfig"
