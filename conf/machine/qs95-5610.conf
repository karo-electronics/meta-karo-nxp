#@TYPE: Machine
#@NAME: Ka-Ro QS95-5610 module
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for Ka-Ro QS95-5610 module
##@MAINTAINER: Robin Lintermann <rl@karo-electronics.de>

MACHINEOVERRIDES =. "qs95:"

require include/imx95-base.inc

KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    freescale/imx95-qs95-5610-qsbase95.dtb \
    freescale/imx95-qs95-raspi-display.dtbo \
    freescale/imx95-qs95-lvds-panel.dtbo \
    freescale/imx95-qs95-cam.dtbo \
"

IMXBOOT_TARGETS_BASENAME = "flash"

UBOOT_CONFIG[default] = "qs95-5610_defconfig"
UBOOT_CONFIG[mfg] = "qs95-5610_mfg_defconfig"
UBOOT_CONFIG[noenv] = "qs95-5610_noenv_defconfig"

OEI_BOARD  = "qs95-5610"
DDR_TYPE   = "lpddr4x"
DDR_FIRMWARE_NAME = " \
    lpddr4x_dmem_v202409.bin \
    lpddr4x_dmem_qb_v202409.bin \
    lpddr4x_imem_v202409.bin \
    lpddr4x_imem_qb_v202409.bin \
"
OEI_DDR_CONFIG     = "QS95_5610_4000MTS_FW2024.09_timing"
