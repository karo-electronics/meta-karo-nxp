# Switch to Debian packaging and include package-management in the image

BB_CONF_FRAGMENT_SUMMARY = "Enable Debian packaging"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment configures the build to use Debian packaging (package_deb) and adds package-management to the image features."

# Switch to Debian packaging and include package-management in the image
PACKAGE_CLASSES = "package_deb"
EXTRA_IMAGE_FEATURES += "package-management"
