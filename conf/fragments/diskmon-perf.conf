# Disk monitoring and performance settings
#
# Configures disk space monitoring to prevent builds from failing due to
# insufficient disk space, with thresholds for build directories.

BB_CONF_FRAGMENT_SUMMARY = "Disk monitoring and performance settings"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment enables build statistics, disables patch resolution, and sets disk space monitoring thresholds for TMPDIR, DL_DIR, SSTATE_DIR, and /tmp."

USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
    