# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "karo-nxp"
BBFILE_PATTERN_karo-nxp := "^${LAYERDIR}/"
BBFILE_PRIORITY_karo-nxp = "10"

LAYERDEPENDS_karo = "core networking-layer meta-python fsl-bsp-release"
LAYERSERIES_COMPAT_karo-nxp = "wrynose"

OE_FRAGMENTS_BUILTIN:append = " baseboard:KARO_BASEBOARD"

BBMASK += ".*/meta-imx/meta-imx-bsp/recipes-bsp/imx-mkimage/imx-boot.*.bbappend"
