# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "karo-imx"
BBFILE_PATTERN_karo-imx := "^${LAYERDIR}/"
BBFILE_PRIORITY_karo-imx = "10"

LAYERDEPENDS_karo-imx = "fsl-bsp-release"
LAYERSERIES_COMPAT_karo-imx = "wrynose"

BBMASK += ".*/meta-imx/meta-imx-bsp/recipes-bsp/imx-mkimage/imx-boot.*.bbappend"
