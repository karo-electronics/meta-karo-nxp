# Ka-Ro i.MX DISTRO with Wayland

require include/karo-imx-base.inc

DISTRO = "karo-imx-wayland"
DISTRO_NAME = "Ka-Ro i.MX Distro with Wayland"

# add support for wayland
DISTRO_FEATURES:append = " \
    opengl \
    vulkan \
    wayland \
"

DISTRO_FEATURES_DEFAULTS:append = " vivante_gpu"

DISTRO_FEATURES:append = " opencl pam"
DISTRO_FEATURES:remove = "pulseaudio"

IMX_MALI_DRIVERS ??= "mali-imx mesa"

PACKAGECONFIG:append:pn-pulseaudio = " autospawn-for-root"

PACKAGECONFIG:append:pn-mesa-demos = " wayland"
PACKAGECONFIG:remove:pn-mesa-demos = "vulkan"
