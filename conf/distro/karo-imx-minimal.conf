# Ka-Ro i.MX Minimal DISTRO

require include/karo-imx-base.inc

DISTRO = "karo-imx-minimal"
DISTRO_NAME = "Ka-Ro i.MX Minimal Distro"

DISTRO_FEATURES:remove = " \
    gobject-introspection-data \
    multiarch \
    pulseaudio \
"

DISTRO_FEATURES_OPTED_OUT += " \
    gobject-introspection-data \
    pulseaudio \
"

# kernelfeatures not needed in minimal
DISTRO_FEATURES_DEFAULTS:remove = " \
    csi-camera \
    imx219 \
    vivante_gpu \
"

MACHINE_EXTRA_RRECOMMENDS:remove = "udev-rules-imx"

