# DDR QuickBoot (doc/board/nxp/qb.rst): let SPL persist the OEI DDR
# training data (qb state) to the boot device so that OEI runs the
# QuickBoot flow and skips DDR training on subsequent boots
CONFIG_SPL_IMX_QB=y
# required to write the qb state to the eMMC/SD boot device from SPL
CONFIG_SPL_MMC_WRITE=y
